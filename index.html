<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Somn Pufos – Lenjerii de pat la 300 RON</title>
  <style>
    :root {
      --bg: #faf8f5;
      --card: #ffffff;
      --ink: #1f2421;
      --muted: #636b65;
      --accent: #2f5d50;
      --accent-dark: #23463c;
      --whatsapp: #1fa855;
      --whatsapp-dark: #168341;
      --border: #e6e1d8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      padding-bottom: 48px;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 28px 20px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #e8f1ee;
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      max-width: 560px;
      margin: 0 auto 18px;
    }

    .price-pill {
      display: inline-block;
      background: var(--accent);
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 18px;
      border-radius: 10px;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-wa {
      background: var(--whatsapp);
      color: #ffffff;
    }

    .btn-wa:hover {
      background: var(--whatsapp-dark);
    }

    .btn-call {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-call:hover {
      background: var(--accent-dark);
    }

    main {
      max-width: 1060px;
      margin: 28px auto 0;
      padding: 0 16px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
      background: #efeae2;
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
    }

    .card-price {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
    }

    .card-actions {
      margin-top: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 6px;
    }

    .card-actions .btn {
      padding: 9px 10px;
      font-size: 13px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-top: 36px;
      padding: 0 16px;
    }
  </style>
</head>
<body>
  <header>
    <div class="badge">Somn Pufos • Colecție Lenjerii</div>
    <h1>Somn Pufos</h1>
    <p class="subtitle">Lenjerii de pat confortabile, 10 modele disponibile la comandă rapidă prin WhatsApp sau telefon.</p>
    <div class="price-pill">300 RON / set</div>
    <div class="top-actions">
      <a class="btn btn-wa" href="https://wa.me/40750274030?text=Bun%C4%83%21%20Vreau%20mai%20multe%20detalii%20despre%20lenjeriile%20Somn%20Pufos%20%28300%20RON%2Fset%29.">
        Comandă pe WhatsApp
      </a>
      <a class="btn btn-call" href="tel:+40750274030">
        Sună: 0750 274 030
      </a>
    </div>
  </header>

  <main>
    <h2 class="section-title">Modele disponibile (10 seturi)</h2>
    <div class="grid" id="catalog"></div>
  </main>

  <footer>
    Somn Pufos • Preț: 300 RON / set • Contact: 0750 274 030
  </footer>

  <script>
    const images = [
      "Screenshot_20261121_171456_Chrome.jpg",
      "Screenshot_20261121_171549_Chrome.jpg",
      "Screenshot_20261121_171559_Chrome.jpg",
      "Screenshot_20261121_171612_Chrome.jpg",
      "Screenshot_20261121_171624_Chrome.jpg",
      "Screenshot_20261121_171635_Chrome.jpg",
      "Screenshot_20261121_171644_Chrome.jpg",
      "Screenshot_20261121_171653_Chrome.jpg",
      "Screenshot_20261121_171703_Chrome.jpg",
      "Screenshot_20261121_171719_Chrome.jpg"
    ];

    const catalog = document.getElementById("catalog");

    images.forEach((fileName, index) => {
      const setNumber = index + 1;
      const waText = encodeURIComponent(
        `Bună! Mă interesează Setul #${setNumber} (${fileName}) de la Somn Pufos – 300 RON.`
      );

      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <img src="./${fileName}" alt="Set lenjerie ${setNumber} Somn Pufos" loading="lazy" />
        <div class="card-body">
          <div class="card-title">Set Lenjerie #${setNumber}</div>
          <div class="card-price">300 RON / set</div>
          <div class="card-actions">
            <a class="btn btn-wa" href="https://wa.me/40750274030?text=${waText}">WhatsApp</a>
            <a class="btn btn-call" href="tel:+40750274030">Sună</a>
          </div>
        </div>
      `;
      catalog.appendChild(card);
    });
  </script>
</body>
</html>
